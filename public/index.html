<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Relay sessions</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Relay home">relay<span>.</span></a>
        <button id="sign-out" class="quiet hidden" type="button">Sign out</button>
      </header>
      <section id="signed-out" class="card hidden" aria-labelledby="signin-title">
        <h2 id="signin-title">Welcome back</h2>
        <p>Sign in with your AppHorde account to manage sessions.</p>
        <a id="sign-in" class="button" href="/api/v1/auth/login">Sign in</a>
      </section>
      <section id="sessions-view" class="card hidden" aria-labelledby="sessions-title">
        <div class="section-head">
          <div>
            <h2 id="sessions-title">Your sessions</h2>
            <p class="muted">Create and manage your sessions.</p>
          </div>
        </div>
        <div class="create-row">
          <label class="visibility"><input id="public-session" type="checkbox" /> Public</label>
          <button id="create-session" class="button" type="button">Create session</button>
        </div>
        <p id="visibility-copy" class="muted">Only connections with a session key can connect.</p>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <ul id="session-list" class="session-list"></ul>
      </section>
      <footer>Public sessions allow anyone to read and write. Private sessions require a session key.</footer>
    </main>
  </body>
</html>
